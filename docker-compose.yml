services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:8080
    volumes:
      # Read-only mount so the container can use a local serviceAccountKey.json
      - ./backend/config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
    restart: unless-stopped
    # To run MongoDB locally instead of Atlas, you can add a mongodb service
    # and update MONGO_URI in .env to point to it.

  frontend:
    build:
      context: ./client/frontend
      args:
        # Vite bakes env vars in at build time. Firebase config comes from client/frontend/.env
        # (copied into the build stage); this points the browser at the compose backend.
        - VITE_API_URL=http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
