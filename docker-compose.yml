version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:8080
    volumes:
      - ./backend/config:/app/config # Optional: mount config dir for serviceAccountKey
    # To run MongoDB locally instead of Atlas, you can add a mongodb service
    # and update MONGO_URI in .env to point to it.

  frontend:
    build:
      context: ./client/frontend
      args:
        # These need to be provided during the build phase for Vite
        # The values here act as fallbacks if not provided in the host environment
        - VITE_API_URL=http://localhost:5000
    ports:
      - "8080:80"
    env_file:
      - ./client/frontend/.env
    depends_on:
      - backend
